name: Deploy naar GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  actions: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Bepaal basispad
        id: base
        run: |
          repo="${GITHUB_REPOSITORY#*/}"
          if [[ "$repo" == *.github.io ]]; then
            echo "path=/" >> "$GITHUB_OUTPUT"
          else
            echo "path=/$repo/" >> "$GITHUB_OUTPUT"
          fi

      - name: Installeer dependencies
        run: pnpm install --frozen-lockfile

      - name: Bouw de site
        run: pnpm build
        env:
          VITE_BASE_PATH: ${{ steps.base.outputs.path }}
          VITE_PLAUSIBLE_DOMAIN: ${{ vars.VITE_PLAUSIBLE_DOMAIN }}
          VITE_TURNSTILE_SITE_KEY: ${{ vars.VITE_TURNSTILE_SITE_KEY }}

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # De repository staat nog op "Deploy from a branch". Daardoor publiceert
      # GitHub na elke push ook de bronbestanden via de oude
      # "pages build and deployment"-job, soms nadat deze workflow al klaar is.
      # Wacht tot die job klaar is, zodat de gebouwde site als laatste staat.
      # Zet Pages op "GitHub Actions" om deze stap overbodig te maken.
      - name: Wacht op de oude Pages-build
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.sha }}
        run: |
          sleep 15
          for attempt in $(seq 1 60); do
            running=$(gh api "repos/$GITHUB_REPOSITORY/actions/runs?head_sha=$SHA&per_page=100" \
              --jq '[.workflow_runs[] | select(.name == "pages build and deployment" and (.status == "queued" or .status == "in_progress"))] | length')
            if [ "$running" = "0" ]; then
              echo "De oude Pages-build is klaar."
              exit 0
            fi
            echo "Wachten op de oude Pages-build..."
            sleep 5
          done
          echo "Tijdlimiet bereikt; de deploy gaat toch verder."

      - id: deployment
        uses: actions/deploy-pages@v4

      - name: Controleer dat de gebouwde site live staat
        env:
          URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          for attempt in $(seq 1 12); do
            if curl -fsSL -H 'Cache-Control: no-cache' "$URL?verify=$(date +%s)" | grep -q '/assets/index-'; then
              echo "De gebouwde site staat live."
              exit 0
            fi
            sleep 10
          done
          echo "De site serveert nog de bronbestanden. Controleer de Pages-bron." >&2
          exit 1
