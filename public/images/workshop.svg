<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
  <title id="title">Werksessie met een team</title>
  <desc id="desc">Plaatsvervangende illustratie van een werksessie: mensen rond een tafel met een groot vel papier.</desc>
  <defs>
    <linearGradient id="room" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#EEF5F3" />
      <stop offset="1" stop-color="#E8EEE4" />
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#0F3B3B" flood-opacity="0.14" />
    </filter>
  </defs>

  <rect width="1200" height="800" fill="url(#room)" />
  <circle cx="1040" cy="120" r="170" fill="#FDFBF7" opacity="0.55" />
  <circle cx="120" cy="700" r="130" fill="#E4572E" opacity="0.08" />

