  <rect x="80" y="960" width="640" height="1" fill="#1C2421" opacity="0.16" />
  <text x="80" y="1002" font-family="Inter, Helvetica, Arial, sans-serif" font-size="16" font-weight="600" letter-spacing="2" fill="#66706A">EEN PRAKTISCH MANAGEMENTBOEK</text>
  <text x="80" y="1040" font-family="Georgia, 'Times New Roman', serif" font-size="24" fill="#1C2421">Iepe Soet</text>
  <text x="720" y="1040" text-anchor="end" font-family="Inter, Helvetica, Arial, sans-serif" font-size="13" letter-spacing="1.5" fill="#8A938D">CIRKELVANIMPACT.NL</text>
