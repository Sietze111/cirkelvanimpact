<svg xmlns="http://www.w3.org/2000/svg" width="800" height="1120" viewBox="0 0 800 1120" role="img" aria-labelledby="title desc">
  <title id="title">Conceptomslag De Cirkel van Impact</title>
  <desc id="desc">Placeholder boekomslag met de titel De Cirkel van Impact van Iepe Soet.</desc>
  <defs>
    <linearGradient id="cover" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FDFBF7" />
      <stop offset="0.55" stop-color="#F8F2E8" />
      <stop offset="1" stop-color="#F0E6D6" />
    </linearGradient>
    <linearGradient id="spine" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0F3B3B" stop-opacity="0.12" />
      <stop offset="0.5" stop-color="#0F3B3B" stop-opacity="0.03" />
      <stop offset="1" stop-color="#0F3B3B" stop-opacity="0.14" />
    </linearGradient>
  </defs>

  <rect width="800" height="1120" fill="url(#cover)" />
  <rect x="0" y="0" width="26" height="1120" fill="url(#spine)" />
  <rect x="26" y="0" width="1" height="1120" fill="#1C2421" opacity="0.08" />

  <rect x="80" y="88" width="64" height="4" fill="#E4572E" />
  <text x="80" y="138" font-family="Inter, Helvetica, Arial, sans-serif" font-size="17" font-weight="600" letter-spacing="4.5" fill="#C94524">IEPE SOET</text>

  <text x="78" y="286" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#1C2421">DE CIRKEL</text>
  <text x="78" y="366" font-family="Georgia, 'Times New Roman', serif" font-size="76" font-weight="700" letter-spacing="-1.5" fill="#17504F">VAN IMPACT</text>

  <text x="80" y="430" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#3A443F">Waarom harder rennen zelden helpt,</text>
  <text x="80" y="462" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#3A443F">en beter verbinden en sturen</text>
  <text x="80" y="494" font-family="Inter, Helvetica, Arial, sans-serif" font-size="23" fill="#3A443F">meestal wel.</text>

  <g>
    <circle cx="400" cy="700" r="208" fill="none" stroke="#E4572E" stroke-width="1.5" opacity="0.55" />
    <circle cx="400" cy="700" r="164" fill="none" stroke="#17504F" stroke-width="1.5" opacity="0.5" stroke-dasharray="3 9" />
    <circle cx="400" cy="700" r="118" fill="#0F3B3B" />
    <circle cx="400" cy="700" r="60" fill="none" stroke="#F8F2E8" stroke-width="1.5" opacity="0.6" />
    <circle cx="400" cy="700" r="9" fill="#E4572E" />

    <circle cx="400" cy="492" r="12" fill="#FDFBF7" stroke="#C94524" stroke-width="2" />
    <circle cx="580" cy="804" r="12" fill="#FDFBF7" stroke="#C94524" stroke-width="2" />
    <circle cx="220" cy="804" r="12" fill="#FDFBF7" stroke="#C94524" stroke-width="2" />
    <circle cx="400" cy="908" r="6" fill="#17504F" />
